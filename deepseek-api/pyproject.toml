[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-api"
version = "0.1.0"
description = "Unofficial DeepSeek Web Client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wasmtime>=45.0.0",
    "curl-cffi>=0.15.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["chat"]
packages = ["wasm"]
